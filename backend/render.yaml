services:
  - type: web
    name: chess-tutor-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && curl -L -o stockfish.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar && tar -xf stockfish.tar && chmod +x stockfish/stockfish-ubuntu-x86-64-avx2
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STOCKFISH_PATH
        value: stockfish/stockfish-ubuntu-x86-64-avx2
      - key: OPENROUTER_API_KEY
        sync: false

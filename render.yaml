services:
  - type: web
    name: chess-tutor-backend
    runtime: python
    rootDir: backend
    buildCommand: sudo apt-get install -y stockfish && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STOCKFISH_PATH
        value: stockfish
      - key: OPENROUTER_API_KEY
        sync: false
